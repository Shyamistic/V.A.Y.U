[build-system]
requires = []
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "monsoon-grid"
version = "1.0.0"
description = "Deterministic simulation-only renewable portfolio orchestrator"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.115.6",
  "pydantic==2.10.5",
  "uvicorn==0.34.0",
  "numpy==2.2.2",
  "scipy==1.15.1",
  "cryptography==44.0.0",
  "python-dotenv==1.0.1",
  "httpx==0.28.1",
  "pytest==8.3.4",
  "hypothesis==6.125.3",
  "ruff==0.9.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["machine_local: requires the authoring workstation's protected inputs"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E702", "F401", "F841", "I001"]
