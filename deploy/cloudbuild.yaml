# Cloud Build pipeline (design §10.3). Steps: requirements-sync -> lint -> test ->
# build -> scan -> push. The push step is what a real CI run does; it is NEVER
# executed from this machine (safety: no image push). No plaintext secret appears.
substitutions:
  _IMAGE: "${_REGION}-docker.pkg.dev/${PROJECT_ID}/monsoongrid/monsoongrid"
  _REGION: "asia-south1"
  _SOURCE_REVISION: "${COMMIT_SHA}"
  _SOURCE_TREE_DIGEST: "${COMMIT_SHA}"
  _VULN_FAIL_SEVERITY: "HIGH"

steps:
  - id: frontend-build
    name: node:22-bookworm-slim
    entrypoint: bash
    args:
      - -c
      - "cd src/monsoon_grid/ui && npm ci && npm audit --audit-level=high && npm run build"

  - id: requirements-sync
    name: python:3.13-slim-bookworm
    entrypoint: python
    args: ["deploy/check_requirements_sync.py"]

  - id: lint
    name: python:3.13-slim-bookworm
    entrypoint: bash
    args:
      - -c
      - "pip install --no-cache-dir ruff==0.9.4 && ruff check --no-cache src tests deploy"

  - id: test
    name: python:3.13-slim-bookworm
    entrypoint: bash
    args:
      - -c
      - "pip install --no-cache-dir -r deploy/requirements-linux-dev.txt && PYTHONPATH=src pytest -q tests"

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/Dockerfile
      - --build-arg
      - "SOURCE_REVISION=${_SOURCE_REVISION}"
      - --build-arg
      - "SOURCE_TREE_DIGEST=${_SOURCE_TREE_DIGEST}"
      - -t
      - "${_IMAGE}:${_SOURCE_REVISION}"
      - -t
      - "${_IMAGE}:latest"
      - .

  - id: scan
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud artifacts docker images scan "${_IMAGE}:${_SOURCE_REVISION}" \
          --format=json --location="${_REGION}" > /workspace/scan.json
        python3 deploy/vuln_gate.py /workspace/scan.json "${_VULN_FAIL_SEVERITY}"

  - id: push
    name: gcr.io/cloud-builders/docker
    # NEVER run from the implementer host. Pushes both tags in a real CI run.
    args: ["push", "--all-tags", "${_IMAGE}"]

images:
  - "${_IMAGE}:${_SOURCE_REVISION}"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
