name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: monsoon_grid
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --no-deps --require-hashes --target runtime/site-packages -r requirements.lock
      - run: |
          $env:PYTHONPATH = "src;runtime/site-packages"
          python -m ruff check --no-cache src tests
      - run: |
          $env:PYTHONPATH = "src;runtime/site-packages"
          python -m pytest -q -p no:cacheprovider -m "not machine_local" tests
      - run: |
          $env:PYTHONPATH = "src;runtime/site-packages"
          python scripts/check_gates.py --runtime-root runtime-ci
